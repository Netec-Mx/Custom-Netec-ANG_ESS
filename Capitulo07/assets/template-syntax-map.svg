<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410" role="img" aria-labelledby="t d">
  <title id="t">Mapa de sintaxis de templates</title><desc id="d">Cinco tarjetas relacionan sintaxis Angular con su propósito.</desc>
  <rect width="1200" height="410" rx="28" fill="#f5f7fb"/>
  <text x="600" y="56" text-anchor="middle" font-family="Arial" font-size="31" font-weight="700" fill="#17213a">Sintaxis que debes reconocer</text>
  <g font-family="Arial">
    <g transform="translate(42 105)"><rect width="210" height="220" rx="18" fill="#fff" stroke="#5b4bdb" stroke-width="3"/><text x="105" y="58" text-anchor="middle" font-family="Consolas" font-size="23" font-weight="700" fill="#5b4bdb">{{ valor }}</text><text x="105" y="108" text-anchor="middle" font-size="21" font-weight="700" fill="#17213a">Interpolación</text><text x="105" y="153" text-anchor="middle" font-size="18" fill="#405064">Muestra datos</text></g>
    <g transform="translate(269 105)"><rect width="210" height="220" rx="18" fill="#fff" stroke="#168a8a" stroke-width="3"/><text x="105" y="58" text-anchor="middle" font-family="Consolas" font-size="23" font-weight="700" fill="#087272">[prop]</text><text x="105" y="108" text-anchor="middle" font-size="21" font-weight="700" fill="#17213a">Propiedad</text><text x="105" y="153" text-anchor="middle" font-size="18" fill="#405064">Configura la vista</text></g>
    <g transform="translate(496 105)"><rect width="210" height="220" rx="18" fill="#fff" stroke="#e13a78" stroke-width="3"/><text x="105" y="58" text-anchor="middle" font-family="Consolas" font-size="23" font-weight="700" fill="#a51f55">(evento)</text><text x="105" y="108" text-anchor="middle" font-size="21" font-weight="700" fill="#17213a">Evento</text><text x="105" y="153" text-anchor="middle" font-size="18" fill="#405064">Ejecuta acciones</text></g>
    <g transform="translate(723 105)"><rect width="210" height="220" rx="18" fill="#fff" stroke="#d78b00" stroke-width="3"/><text x="105" y="58" text-anchor="middle" font-family="Consolas" font-size="22" font-weight="700" fill="#a86600">[(ngModel)]</text><text x="105" y="108" text-anchor="middle" font-size="21" font-weight="700" fill="#17213a">Dos vías</text><text x="105" y="153" text-anchor="middle" font-size="18" fill="#405064">Sincroniza valores</text></g>
    <g transform="translate(950 105)"><rect width="210" height="220" rx="18" fill="#fff" stroke="#667085" stroke-width="3"/><text x="105" y="58" text-anchor="middle" font-family="Consolas" font-size="22" font-weight="700" fill="#475467">@if · @for</text><text x="105" y="108" text-anchor="middle" font-size="21" font-weight="700" fill="#17213a">Control flow</text><text x="105" y="153" text-anchor="middle" font-size="18" fill="#405064">Decide qué renderizar</text></g>
  </g>
  <text x="600" y="372" text-anchor="middle" font-family="Arial" font-size="21" fill="#405064">Cada sintaxis resuelve una responsabilidad concreta del template.</text>
</svg>
