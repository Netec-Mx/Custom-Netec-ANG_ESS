<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700" role="img" aria-labelledby="title desc">
  <title id="title">Estructura de la ficha de investigación</title>
  <desc id="desc">Guía visual con cuatro secciones y las evidencias que debe contener la ficha final.</desc>
  <rect width="1600" height="700" fill="#f5f8fc"/>
  <rect x="0" y="0" width="1600" height="18" fill="#fdb913"/>
  <text x="70" y="85" font-family="Arial, sans-serif" font-size="42" font-weight="700" fill="#003b71">Ficha final: una página</text>
  <text x="70" y="125" font-family="Arial, sans-serif" font-size="23" fill="#4b5563">Cada bloque responde a una evidencia concreta</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(70 180)">
      <rect width="700" height="190" rx="18" fill="#ffffff" stroke="#2b74b9" stroke-width="3"/>
      <circle cx="65" cy="62" r="30" fill="#003b71"/><text x="65" y="72" text-anchor="middle" font-size="27" font-weight="700" fill="#fff">1</text>
      <text x="115" y="57" font-size="28" font-weight="700" fill="#003b71">¿Qué es Angular?</text>
      <text x="115" y="98" font-size="21" fill="#374151">Definición propia + tres capacidades</text>
      <text x="115" y="135" font-size="19" fill="#667085">Fuente principal: documentación de Angular 21</text>
    </g>
    <g transform="translate(830 180)">
      <rect width="700" height="190" rx="18" fill="#ffffff" stroke="#2b74b9" stroke-width="3"/>
      <circle cx="65" cy="62" r="30" fill="#1769aa"/><text x="65" y="72" text-anchor="middle" font-size="27" font-weight="700" fill="#fff">2</text>
      <text x="115" y="57" font-size="28" font-weight="700" fill="#003b71">Cinco hitos</text>
      <text x="115" y="98" font-size="21" fill="#374151">Hito + impacto en una frase</text>
      <text x="115" y="135" font-size="19" fill="#667085">Evita una cronología exhaustiva</text>
    </g>
    <g transform="translate(70 410)">
      <rect width="700" height="190" rx="18" fill="#ffffff" stroke="#2b74b9" stroke-width="3"/>
      <circle cx="65" cy="62" r="30" fill="#2b84c6"/><text x="65" y="72" text-anchor="middle" font-size="27" font-weight="700" fill="#fff">3</text>
      <text x="115" y="57" font-size="28" font-weight="700" fill="#003b71">Comparación contextual</text>
      <text x="115" y="98" font-size="21" fill="#374151">Angular + React + Vue; cuatro criterios</text>
      <text x="115" y="135" font-size="19" fill="#667085">Registra fuente y fecha de consulta</text>
    </g>
    <g transform="translate(830 410)">
      <rect width="700" height="190" rx="18" fill="#ffffff" stroke="#fdb913" stroke-width="4"/>
      <circle cx="65" cy="62" r="30" fill="#fdb913"/><text x="65" y="72" text-anchor="middle" font-size="27" font-weight="700" fill="#003b71">4</text>
      <text x="115" y="57" font-size="28" font-weight="700" fill="#003b71">Recursos y conclusión</text>
      <text x="115" y="98" font-size="21" fill="#374151">Tres recursos + conclusión de 3–4 líneas</text>
      <text x="115" y="135" font-size="19" fill="#667085">Entrega: DOCX o PDF</text>
    </g>
  </g>
  <text x="70" y="660" font-family="Arial, sans-serif" font-size="19" fill="#667085">La calidad se evalúa por síntesis y fuentes, no por cantidad de páginas.</text>
</svg>
