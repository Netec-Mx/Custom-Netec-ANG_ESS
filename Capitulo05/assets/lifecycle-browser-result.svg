<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="720" viewBox="0 0 1500 720">
  <rect width="1500" height="720" fill="#f4f7fb"/><rect width="1500" height="12" fill="#fbb000"/>
  <text x="70" y="80" font-family="Arial" font-size="45" font-weight="700" fill="#003b71">Qué debes observar</text>
  <rect x="70" y="125" width="650" height="500" rx="18" fill="#fff" stroke="#c8d4df" stroke-width="3"/>
  <text x="395" y="205" text-anchor="middle" font-family="Arial" font-size="35" font-weight="700" fill="#003b71">Ciclo de vida</text>
  <rect x="205" y="255" width="380" height="70" rx="8" fill="#003b71"/><text x="395" y="300" text-anchor="middle" font-family="Arial" font-size="23" fill="#fff">Ocultar componente</text>
  <rect x="175" y="375" width="440" height="150" rx="10" fill="#fff" stroke="#2c75b9" stroke-width="3"/><text x="220" y="430" font-family="Arial" font-size="27" font-weight="700" fill="#003b71">Componente activo</text><text x="220" y="480" font-family="Arial" font-size="23" fill="#26384a">Tiempo visible: 3 s</text>
  <rect x="780" y="125" width="650" height="500" rx="18" fill="#101820"/>
  <text x="825" y="205" font-family="Consolas" font-size="24" fill="#7ee787">1. ngOnInit</text><text x="825" y="260" font-family="Consolas" font-size="24" fill="#7ee787">2. ngAfterViewInit</text><text x="825" y="345" font-family="Consolas" font-size="24" fill="#ffcf66">3. ngOnDestroy</text><text x="825" y="395" font-family="Consolas" font-size="22" fill="#d7e3ef">intervalo cancelado</text>
  <text x="70" y="680" font-family="Arial" font-size="21" fill="#56697d">La pantalla demuestra el estado; la consola demuestra el orden y la limpieza.</text>
</svg>
