<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="560" viewBox="0 0 1500 560">
  <rect width="1500" height="560" fill="#f4f7fb"/><rect width="1500" height="12" fill="#fbb000"/>
  <text x="70" y="82" font-family="Arial" font-size="45" font-weight="700" fill="#003b71">Un ciclo de vida observable</text>
  <text x="70" y="124" font-family="Arial" font-size="24" fill="#44546a">Crear → inicializar → mostrar → destruir → limpiar</text>
  <g font-family="Arial" text-anchor="middle">
    <rect x="80" y="205" width="310" height="180" rx="18" fill="#fff" stroke="#2c75b9" stroke-width="3"/><text x="235" y="270" font-size="30" font-weight="700" fill="#003b71">CREAR</text><text x="235" y="325" font-size="23" fill="#26384a">@if = true</text>
    <path d="M410 295 H535" stroke="#2c75b9" stroke-width="10"/><path d="M535 295 l-28 -22 v44z" fill="#2c75b9"/>
    <rect x="550" y="205" width="400" height="180" rx="18" fill="#eaf3fa" stroke="#2c75b9" stroke-width="3"/><text x="750" y="260" font-size="29" font-weight="700" fill="#003b71">INICIALIZAR Y VER</text><text x="750" y="310" font-size="22" fill="#26384a">ngOnInit</text><text x="750" y="345" font-size="22" fill="#26384a">ngAfterViewInit</text>
    <path d="M970 295 H1095" stroke="#2c75b9" stroke-width="10"/><path d="M1095 295 l-28 -22 v44z" fill="#2c75b9"/>
    <rect x="1110" y="205" width="310" height="180" rx="18" fill="#fff" stroke="#fbb000" stroke-width="4"/><text x="1265" y="270" font-size="30" font-weight="700" fill="#003b71">DESTRUIR</text><text x="1265" y="325" font-size="23" fill="#26384a">ngOnDestroy</text>
  </g>
  <text x="70" y="500" font-family="Arial" font-size="21" fill="#56697d">La limpieza evita que tareas del componente sigan activas después de retirarlo.</text>
</svg>
