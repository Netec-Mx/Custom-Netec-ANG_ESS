<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="680" viewBox="0 0 1500 680">
  <rect width="1500" height="680" fill="#f4f7fb"/>
  <rect width="1500" height="12" fill="#fbb000"/>
  <text x="70" y="82" font-family="Arial, sans-serif" font-size="45" font-weight="700" fill="#003b71">Anatomía de la clase Libro</text>
  <text x="70" y="124" font-family="Arial, sans-serif" font-size="24" fill="#44546a">Estado + construcción + comportamiento</text>
  <rect x="155" y="170" width="1190" height="410" rx="18" fill="#fff" stroke="#2c75b9" stroke-width="3"/>
  <rect x="155" y="170" width="1190" height="82" rx="18" fill="#003b71"/>
  <text x="750" y="225" text-anchor="middle" font-family="Consolas, monospace" font-size="38" font-weight="700" fill="#fff">class Libro</text>
  <line x1="550" y1="252" x2="550" y2="580" stroke="#d6e0e9" stroke-width="2"/>
  <line x1="950" y1="252" x2="950" y2="580" stroke="#d6e0e9" stroke-width="2"/>
  <g font-family="Arial, sans-serif">
    <text x="205" y="310" font-size="29" font-weight="700" fill="#003b71">PROPIEDADES</text>
    <text x="205" y="365" font-family="Consolas, monospace" font-size="23" fill="#26384a">readonly isbn</text>
    <text x="205" y="410" font-family="Consolas, monospace" font-size="23" fill="#26384a">titulo</text>
    <text x="205" y="455" font-family="Consolas, monospace" font-size="23" fill="#26384a">autor</text>
    <text x="205" y="500" font-family="Consolas, monospace" font-size="23" fill="#26384a">private disponible</text>
    <text x="600" y="310" font-size="29" font-weight="700" fill="#003b71">CONSTRUCTOR</text>
    <text x="600" y="370" font-size="23" fill="#26384a">Recibe los datos</text>
    <text x="600" y="410" font-size="23" fill="#26384a">iniciales del libro</text>
    <text x="600" y="475" font-family="Consolas, monospace" font-size="23" fill="#146cb0">new Libro(...)</text>
    <text x="1000" y="310" font-size="29" font-weight="700" fill="#003b71">MÉTODOS</text>
    <text x="1000" y="365" font-family="Consolas, monospace" font-size="23" fill="#26384a">prestar()</text>
    <text x="1000" y="410" font-family="Consolas, monospace" font-size="23" fill="#26384a">devolver()</text>
    <text x="1000" y="455" font-family="Consolas, monospace" font-size="23" fill="#26384a">descripcion()</text>
  </g>
  <text x="70" y="635" font-family="Arial, sans-serif" font-size="21" fill="#56697d">La clase protege su estado y ofrece métodos para modificarlo de manera controlada.</text>
</svg>
